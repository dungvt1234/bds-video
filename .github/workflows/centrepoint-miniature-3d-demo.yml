name: Centre Point miniature 3D 5s preview
on:
  push:
    branches: [feat/centrepoint-map-motion]
    paths:
      - 'src/projects/vungtau-centrepoint/CentrePointMiniature3DDemo.tsx'
      - 'src/root.tsx'
      - '.github/workflows/centrepoint-miniature-3d-demo.yml'
  workflow_dispatch:
jobs:
  render-miniature:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Render 5s miniature 3D demo
        run: npx remotion render src/index.ts CentrePointMiniature3DDemo out/centrepoint-miniature-3d-5s.mp4 --codec h264 --concurrency 2
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: centrepoint-miniature-3d-5s
          path: out/centrepoint-miniature-3d-5s.mp4
          retention-days: 7
          if-no-files-found: error
