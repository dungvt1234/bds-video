name: Centre Point City 3D preview
on:
  push:
    branches: [feat/centrepoint-map-motion]
  workflow_dispatch:
jobs:
  city-3d-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Render 5-second City 3D
        run: npx remotion render src/index.ts CentrePointCity3DIntro out/centrepoint-city-3d-5s.mp4 --codec h264 --concurrency 2
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: centrepoint-city-3d-5s
          path: out/centrepoint-city-3d-5s.mp4
          retention-days: 7
          if-no-files-found: error
