name: Centre Point Cinematic Future V5 - Silent Hologram Preview
on:
  push:
    branches: [feat/centrepoint-map-motion]
    paths:
      - 'src/projects/vungtau-centrepoint/CentrePointCinematicFutureV5.tsx'
      - 'src/projects/vungtau-centrepoint/data/prepare-v3-map.mjs'
      - 'src/root.tsx'
      - '.github/workflows/centrepoint-cinematic-future-v5.yml'
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Compile TypeScript
        run: npx tsc --noEmit
      - name: Prepare authentic Vung Tau OSM roads and coastline
        run: node src/projects/vungtau-centrepoint/data/prepare-v3-map.mjs
      - name: Hologram core frame
        run: npx remotion still src/index.ts CentrePointCinematicFutureV5 out/v5-00-core.png --frame=78
      - name: Animated amenity ring frame
        run: npx remotion still src/index.ts CentrePointCinematicFutureV5 out/v5-01-amenities.png --frame=230
      - name: Lotte landmark activation
        run: npx remotion still src/index.ts CentrePointCinematicFutureV5 out/v5-02-lotte.png --frame=338
      - name: Hospital target reveal
        run: npx remotion still src/index.ts CentrePointCinematicFutureV5 out/v5-03-hospital.png --frame=425
      - name: Coastal route target
        run: npx remotion still src/index.ts CentrePointCinematicFutureV5 out/v5-04-coast.png --frame=608
      - name: Network activation frame
        run: npx remotion still src/index.ts CentrePointCinematicFutureV5 out/v5-05-network.png --frame=735
      - name: Render complete silent 30s master
        run: npx remotion render src/index.ts CentrePointCinematicFutureV5 out/centrepoint-cinematic-future-v5-SILENT-30s.mp4 --codec h264 --concurrency 2
      - name: Verify true zero-audio MP4 tracks without ffprobe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack_from
          p=Path('out/centrepoint-cinematic-future-v5-SILENT-30s.mp4')
          data=p.read_bytes()
          def boxes(start,end):
              i=start
              while i+8<=end:
                  size,name=unpack_from('>I4s',data,i)
                  header=8
                  if size==1:
                      if i+16>end: raise RuntimeError('truncated extended atom')
                      size=unpack_from('>Q',data,i+8)[0]
                      header=16
                  elif size==0:
                      size=end-i
                  if size<header or i+size>end:
                      raise RuntimeError('invalid MP4 box '+repr(name))
                  yield name,i+header,i+size
                  i+=size
          handlers=[]
          for box,lo,hi in boxes(0,len(data)):
              if box!=b'moov': continue
              for tag,a,b in boxes(lo,hi):
                  if tag!=b'trak': continue
                  for tag2,x,y in boxes(a,b):
                      if tag2!=b'mdia': continue
                      for tag3,z,w in boxes(x,y):
                          if tag3==b'hdlr':
                              if w-z<12: raise RuntimeError('broken handler metadata')
                              handlers.append(data[z+8:z+12].decode('ascii',errors='replace'))
          assert 'vide' in handlers, 'FAIL: no video track found'
          assert 'soun' not in handlers, f'FAIL: sound track unexpectedly present: {handlers}'
          print('PASS: MP4 track types:', handlers, '(video only, no audio)')
          PY
      - name: Upload MP4 and review frames
        uses: actions/upload-artifact@v4
        with:
          name: centrepoint-cinematic-future-v5-silent
          path: |
            out/centrepoint-cinematic-future-v5-SILENT-30s.mp4
            out/v5-*.png
            public/centrepoint-v3-map-evidence.json
          if-no-files-found: error
          retention-days: 7
