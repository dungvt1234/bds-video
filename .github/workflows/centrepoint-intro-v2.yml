name: Centre Point cinematic intro V2
on:
  push:
    branches: [feat/centrepoint-map-motion]
  workflow_dispatch:
jobs:
  intro-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Render five-second intro
        run: npx remotion render src/index.ts CentrePointCinematicIntro out/centrepoint-cinematic-intro-v2.mp4 --codec h264
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: centrepoint-cinematic-intro-v2
          path: out/centrepoint-cinematic-intro-v2.mp4
          if-no-files-found: error
          retention-days: 7
